name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Buat kerangka proyek Android
        run: flutter create --platforms=android --org id.go.kotim --project-name peta_survei_app build_app
      - name: Pasang kode aplikasi
        run: |
          rm -rf build_app/lib build_app/test
          cp -r app_src/lib build_app/lib
          cp app_src/pubspec.yaml build_app/pubspec.yaml
          python3 tool/patch_manifest.py build_app/android/app/src/main/AndroidManifest.xml
      - name: Matikan lint-vital (bug plugin kamera)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith("lintVital")) {
                t.enabled = false
              }
            }
          }
          EOF
      - name: Bangun APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: peta-survei-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
